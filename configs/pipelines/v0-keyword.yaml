name: v0-keyword
description: Keyword-only baseline using PostgreSQL full text search.
query_processor:
  metadata_filter: false
  rewrite: false
retrieval:
  keyword:
    enabled: true
    top_k: 8
  vector:
    enabled: false
  fusion:
    enabled: false
rerank:
  enabled: false
context:
  top_k: 5
  token_budget: 4000
generation:
  citations_required: true
  refuse_without_context: true
