name: v3-hybrid
description: Keyword and vector retrieval fused by reciprocal rank fusion.
query_processor:
  metadata_filter: true
  rewrite: false
retrieval:
  keyword:
    enabled: true
    top_k: 20
  vector:
    enabled: true
    top_k: 20
    distance: cosine
  fusion:
    enabled: true
    type: rrf
    k: 60
    deduplicate: true
rerank:
  enabled: false
context:
  top_k: 6
  token_budget: 4000
  parent_expansion: true
generation:
  citations_required: true
  refuse_without_context: true
