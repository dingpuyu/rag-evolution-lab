name: v4-routing
description: Query-aware retrieval routing and bounded query transformation.
query_processor:
  metadata_filter: true
  classify: true
  rewrite: true
  preserve_entities: true
  multi_query:
    enabled: true
    max_queries: 3
retrieval:
  router:
    enabled: true
    fallback: hybrid
  keyword:
    enabled: true
    top_k: 20
  vector:
    enabled: true
    top_k: 20
    distance: cosine
  fusion:
    enabled: true
    type: rrf
    k: 60
    deduplicate: true
rerank:
  enabled: false
context:
  top_k: 6
  token_budget: 4000
  parent_expansion: true
generation:
  citations_required: true
  refuse_without_context: true
