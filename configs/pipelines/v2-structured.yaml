name: v2-structured
description: Vector RAG with structure-aware chunks and deterministic metadata filters.
query_processor:
  metadata_filter: true
  rewrite: false
retrieval:
  keyword:
    enabled: false
  vector:
    enabled: true
    top_k: 10
    distance: cosine
  fusion:
    enabled: false
rerank:
  enabled: false
context:
  top_k: 6
  token_budget: 4000
  parent_expansion: true
generation:
  citations_required: true
  refuse_without_context: true
