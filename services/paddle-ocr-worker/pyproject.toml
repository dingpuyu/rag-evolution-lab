[project]
name = "raglab-paddle-ocr-worker"
version = "0.2.0"
description = "Optional PP-StructureV3 OCR worker for Rag Evolution Lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "paddleocr[doc-parser]>=3.7,<4",
  # Linux ARM64 wheels currently lag behind macOS/x86 releases. PP-StructureV3
  # works with 3.2.2, while allowing newer 3.x wheels where available.
  "paddlepaddle>=3.2.2,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
