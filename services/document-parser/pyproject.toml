[project]
name = "raglab-document-parser"
version = "0.1.0"
description = "Stateless multi-format Document IR parser for Rag Evolution Lab"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
