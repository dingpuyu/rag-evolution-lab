services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raglab
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: ${RAGLAB_POSTGRES_PASSWORD:-raglab-local}
    ports:
      - "127.0.0.1:${RAGLAB_POSTGRES_PORT:-5433}:5432"
    volumes:
      - raglab_stack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raglab -d raglab"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${RAGLAB_REDIS_PORT:-6379}:6379"
    volumes:
      - raglab_stack_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - raglab_stack_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${RAGLAB_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RAGLAB_MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - raglab_stack_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.6.20
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${RAGLAB_MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${RAGLAB_MINIO_ROOT_PASSWORD:-minioadmin}
      MQ_TYPE: woodpecker
    volumes:
      - raglab_stack_milvus_data:/var/lib/milvus
    ports:
      # Milvus is an internal data plane. The API container reaches it over
      # the Compose network; host exposure is loopback-only for local labs.
      - "127.0.0.1:${RAGLAB_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${RAGLAB_MILVUS_HEALTH_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 20
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAGLAB_EMBEDDING_BACKEND: ${RAGLAB_EMBEDDING_BACKEND:-hash}
      RAGLAB_HASH_EMBEDDING_DIMENSIONS: ${RAGLAB_HASH_EMBEDDING_DIMENSIONS:-512}
      RAGLAB_OLLAMA_URL: ${RAGLAB_OLLAMA_URL:-http://host.docker.internal:11434}
      RAGLAB_OLLAMA_MODEL: ${RAGLAB_OLLAMA_MODEL:-qwen3-embedding:4b-local}
      RAGLAB_EMBEDDING_BASE_URL: ${RAGLAB_EMBEDDING_BASE_URL:-}
      RAGLAB_EMBEDDING_API_KEY: ${RAGLAB_EMBEDDING_API_KEY:-${QWEN_API_KEY:-${DASHSCOPE_API_KEY:-${TOKENHUB_API_KEY:-}}}}
      RAGLAB_EMBEDDING_MODEL: ${RAGLAB_EMBEDDING_MODEL:-}
      RAGLAB_EMBEDDING_DIMENSIONS: ${RAGLAB_EMBEDDING_DIMENSIONS:-}
      RAGLAB_EMBEDDING_BATCH_SIZE: ${RAGLAB_EMBEDDING_BATCH_SIZE:-}
      RAGLAB_EMBEDDING_VERSION: ${RAGLAB_EMBEDDING_VERSION:-}
      RAGLAB_QUERY_INSTRUCTION: ${RAGLAB_QUERY_INSTRUCTION:-}
      RAGLAB_GENERATION_PROVIDER: ${RAGLAB_GENERATION_PROVIDER:-extractive}
      RAGLAB_GENERATION_API_KEY: ${RAGLAB_GENERATION_API_KEY:-${DEEPSEEK_API_KEY:-}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${RAGLAB_GENERATION_API_KEY:-}}
      RAGLAB_GENERATION_BASE_URL: ${RAGLAB_GENERATION_BASE_URL:-https://api.deepseek.com}
      RAGLAB_GENERATION_MODEL: ${RAGLAB_GENERATION_MODEL:-deepseek-v4-pro}
      RAGLAB_AUTH_SECRET: ${RAGLAB_AUTH_SECRET:-raglab-local-development-secret-change-me}
      RAGLAB_PLATFORM_ADMIN_PASSWORD: ${RAGLAB_PLATFORM_ADMIN_PASSWORD:-change-this-admin-password}
      RAGLAB_AUTH_ISSUER: ${RAGLAB_AUTH_ISSUER:-raglab-local}
      RAGLAB_AUTH_AUDIENCE: ${RAGLAB_AUTH_AUDIENCE:-raglab-api}
      RAGLAB_AUTH_OIDC_ISSUER: ${RAGLAB_AUTH_OIDC_ISSUER:-}
      RAGLAB_AUTH_JWKS_URL: ${RAGLAB_AUTH_JWKS_URL:-}
      RAGLAB_REQUIRE_OIDC: ${RAGLAB_REQUIRE_OIDC:-false}
      RAGLAB_OTEL_ENDPOINT: ${RAGLAB_OTEL_ENDPOINT:-}
      RAGLAB_OTEL_SERVICE_NAME: ${RAGLAB_OTEL_SERVICE_NAME:-rag-evolution-lab}
      RAGLAB_RATE_LIMIT_RPM: ${RAGLAB_RATE_LIMIT_RPM:-120}
      RAGLAB_RATE_LIMIT_BURST: ${RAGLAB_RATE_LIMIT_BURST:-30}
      RAGLAB_TOKEN_QUOTA_PER_MINUTE: ${RAGLAB_TOKEN_QUOTA_PER_MINUTE:-100000}
      RAGLAB_RATE_LIMIT_BACKEND: ${RAGLAB_RATE_LIMIT_BACKEND:-redis}
      RAGLAB_REDIS_URL: ${RAGLAB_REDIS_URL:-redis://redis:6379/0}
      RAGLAB_REDIS_PREFIX: ${RAGLAB_REDIS_PREFIX:-raglab:ratelimit}
      RAGLAB_COST_INPUT_USD_PER_1M: ${RAGLAB_COST_INPUT_USD_PER_1M:-0}
      RAGLAB_COST_OUTPUT_USD_PER_1M: ${RAGLAB_COST_OUTPUT_USD_PER_1M:-0}
      RAGLAB_MILVUS_URL: ${RAGLAB_MILVUS_URL:-http://milvus:19530}
      RAGLAB_POSTGRES_URL: ${RAGLAB_POSTGRES_URL:-postgres://raglab:${RAGLAB_POSTGRES_PASSWORD:-raglab-local}@postgres:5432/raglab?sslmode=disable}
      RAGLAB_MILVUS_COLLECTION: ${RAGLAB_MILVUS_COLLECTION:-raglab_chunks_qwen3}
      RAGLAB_LIFECYCLE_COLLECTION: ${RAGLAB_LIFECYCLE_COLLECTION:-raglab_lifecycle_v1}
      RAGLAB_LIFECYCLE_ALIAS: ${RAGLAB_LIFECYCLE_ALIAS:-raglab_knowledge_active}
      RAGLAB_LIFECYCLE_STATE: ${RAGLAB_LIFECYCLE_STATE:-/var/lib/raglab/lifecycle/state.json}
      RAGLAB_INGESTION_JOB_STATE: /var/lib/raglab/ingestion/jobs.json
      RAGLAB_AUTH_ACCOUNTS: /var/lib/raglab/auth/accounts.json
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${RAGLAB_API_PORT:-8080}:8080"
    volumes:
      - raglab_stack_api_data:/var/lib/raglab
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  agent:
    build:
      context: ../..
      dockerfile: services/agent-orchestrator/Dockerfile
    restart: unless-stopped
    environment:
      RAGLAB_API_URL: http://api:8080
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${RAGLAB_GENERATION_API_KEY:-}}
      RAGLAB_GENERATION_API_KEY: ${RAGLAB_GENERATION_API_KEY:-${DEEPSEEK_API_KEY:-}}
      DEEPSEEK_BASE_URL: ${RAGLAB_GENERATION_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${RAGLAB_GENERATION_MODEL:-deepseek-chat}
      AGENT_CORS_ORIGINS: ${AGENT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:13000,http://127.0.0.1:13000}
    ports:
      - "${RAGLAB_AGENT_PORT:-8090}:8090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
        NEXT_PUBLIC_AGENT_API_BASE: ${NEXT_PUBLIC_AGENT_API_BASE:-http://localhost:8090}
    restart: unless-stopped
    ports:
      - "${RAGLAB_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: raglab-stack

volumes:
  raglab_stack_postgres_data:
  raglab_stack_redis_data:
  raglab_stack_etcd_data:
  raglab_stack_minio_data:
  raglab_stack_milvus_data:
  raglab_stack_api_data:
