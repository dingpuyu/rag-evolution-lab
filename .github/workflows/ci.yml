name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run unit tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./internal/...
      - name: Validate datasets
        run: go run ./cmd/raglab validate
      - name: Run deterministic evaluation gate
        run: make eval-gate
      - name: Verify retrieval degradation policy
        run: make reliability-test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint and test web portal
        run: npm run lint && npm test
