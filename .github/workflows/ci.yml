name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run unit tests
        run: go test ./...
      - name: Validate datasets
        run: go run ./cmd/raglab validate
      - name: Run baseline evaluation
        run: go run ./cmd/raglab compare --baseline v0-keyword --candidate v1-vector --split development
